name: Build and Publish to Itch.io
run-name: build and publish itch.io from ${{ github.ref_name }} by @${{ github.actor }}

on:
    workflow_dispatch: 

permissions:
    contents: read

jobs:
    build-and-publish:
        name: Build and Publish to Itch.io (job)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: itch-production
        
        steps:
          - name: Checkout
            uses: actions/checkout@v6

          - name: .NET SDK
            uses: actions/setup-dotnet@v5
            with:
                dotnet-version: 10.0.110
                workloads: wasm-tools
            
          - name: Publish Browser Host
            working-directory: game
            run: dotnet publish TriJam816.web -c Release

          - name: Butler Setup
            uses: remarkablegames/setup-butler@v3
            with:
                butler-version: 15.27.0
            
          - name: Publish to Itch.io
            env:
                BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
                BUTLER_KEY_SOURCE: github-actions
            run: >-
                butler push
                game/TriJam816.web/AppBundle/
                thxskeleton/mc-trijam-816:html5

